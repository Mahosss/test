<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ɖƲιιȻ</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Reem+Kufi:wght@400;600;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">

<style>
/* ================= Base ================= */
* {
  margin: 0; padding: 0; box-sizing: border-box;
  font-family: 'Tajawal', sans-serif;
}
:root {
  --gold: #d4af37;
  --gold-light: #f5d76e;
  --gold-soft: #c9a227;
  --gold-glow: rgba(212, 175, 55, 0.5);
  --bg: #0a0a0a;
  --bg-2: #141414;
  --card: rgba(20, 18, 12, 0.65);
  --border: rgba(212, 175, 55, 0.28);
  --text: #f5efe0;
  --dim: #a89b7b;
}

html, body { overflow-x: hidden; }

body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 40px 16px;
  position: relative;
  cursor: none;
}
@media (max-width: 768px) { body { cursor: auto; } .cursor, .cursor-dot { display: none; } }

/* ================= Custom Cursor ================= */
.cursor {
  position: fixed;
  width: 34px; height: 34px;
  border: 2px solid var(--gold);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 14px var(--gold-glow), inset 0 0 10px rgba(212,175,55,0.2);
  background: rgba(212,175,55,0.05);
}
.cursor-dot {
  position: fixed;
  width: 6px; height: 6px;
  background: var(--gold-light);
  border-radius: 50%;
  pointer-events: none;
  z-index: 10000;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 12px var(--gold);
}
.cursor.grow {
  transform: translate(-50%, -50%) scale(1.7);
  background: rgba(212, 175, 55, 0.18);
  border-color: var(--gold-light);
  box-shadow: 0 0 24px var(--gold-glow);
}

/* ================= Animated Background ================= */
.bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 20% 10%, rgba(212,175,55,0.10), transparent 55%),
    radial-gradient(ellipse at 80% 90%, rgba(212,175,55,0.08), transparent 55%),
    var(--bg);
}
.grid-overlay {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(212,175,55,0.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(212,175,55,0.045) 1px, transparent 1px);
  background-size: 46px 46px;
  mask-image: radial-gradient(circle at 50% 50%, black 30%, transparent 80%);
  -webkit-mask-image: radial-gradient(circle at 50% 50%, black 30%, transparent 80%);
}
.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(110px);
  opacity: 0.5;
  animation: drift 20s ease-in-out infinite;
}
.orb.o1 { width: 420px; height: 420px; background: var(--gold);   top: -140px; right: -100px; opacity: 0.18; }
.orb.o2 { width: 360px; height: 360px; background: #8b6f1e; bottom: -120px; left: -100px; animation-delay: -7s; opacity: 0.22; }
.orb.o3 { width: 280px; height: 280px; background: var(--gold-light);   top: 45%; left: 55%; opacity: 0.10; animation-delay: -13s; }
@keyframes drift {
  0%,100% { transform: translate(0,0) scale(1); }
  50%     { transform: translate(40px,-40px) scale(1.15); }
}

/* ================= Card ================= */
.card {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 640px;
  background: var(--card);
  backdrop-filter: blur(24px) saturate(150%);
  -webkit-backdrop-filter: blur(24px) saturate(150%);
  border: 1px solid var(--border);
  border-radius: 32px;
  padding: 0 0 40px;
  overflow: hidden;
  box-shadow:
    0 30px 80px rgba(0,0,0,0.75),
    0 0 60px rgba(212,175,55,0.06);
  animation: rise 1s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes rise {
  from { opacity: 0; transform: translateY(40px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(500px circle at var(--mx,50%) var(--my,50%),
              rgba(212,175,55,0.10), transparent 45%);
  opacity: 0;
  transition: opacity 0.4s;
  pointer-events: none;
  z-index: 2;
}
.card:hover::before { opacity: 1; }

/* ================= Cover ================= */
.cover {
  height: 175px;
  position: relative;
  overflow: hidden;
  background: url('https://img.alfrsantv.com/img/f176636174587211.jpg') center/cover no-repeat;
}
.cover::after {
  content: '';
  position: absolute;
  inset: 0;
  background:
    linear-gradient(180deg, rgba(10,10,10,0.1) 0%, rgba(10,10,10,0.95) 100%),
    linear-gradient(120deg, rgba(212,175,55,0.25), rgba(139,111,30,0.3));
  mix-blend-mode: multiply;
}
.cover .shimmer {
  position: absolute;
  top: 0; left: -60%;
  width: 60%; height: 100%;
  background: linear-gradient(100deg, transparent, rgba(245,215,110,0.25), transparent);
  transform: skewX(-20deg);
  animation: shine 4.5s ease-in-out infinite;
  z-index: 1;
}
@keyframes shine {
  0%   { left: -60%; }
  60%  { left: 130%; }
  100% { left: 130%; }
}

/* ================= Avatar ================= */
.avatar-wrap {
  position: relative;
  width: 150px; height: 150px;
  margin: -78px auto 0;
  z-index: 3;
}
.avatar-ring {
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  background: conic-gradient(var(--gold), var(--gold-light), #8b6f1e, var(--gold));
  animation: spin 6s linear infinite;
  filter: blur(2px);
}
@keyframes spin { to { transform: rotate(360deg); } }

.avatar {
  position: relative;
  width: 100%; height: 100%;
  border-radius: 50%;
  background: var(--bg);
  padding: 5px;
  overflow: hidden;
  z-index: 1;
  transition: transform 0.5s cubic-bezier(.2,.9,.3,1.5);
}
.avatar:hover { transform: scale(1.08) rotate(-3deg); }
.avatar img {
  width: 100%; height: 100%;
  border-radius: 50%;
  object-fit: cover;
  display: block;
  user-select: none; pointer-events: none;
}

.status {
  position: absolute;
  bottom: 10px; left: 6px;
  width: 22px; height: 22px;
  background: #2ecc71;
  border: 3px solid #14120c;
  border-radius: 50%;
  z-index: 4;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(46,204,113,0.6); }
  50%     { box-shadow: 0 0 0 8px rgba(46,204,113,0); }
}

/* ================= Header ================= */
.header {
  text-align: center;
  padding: 22px 26px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.name {
  font-family: 'Playfair Display', 'Reem Kufi', serif;
  font-size: 34px;
  font-weight: 700;
  letter-spacing: 2px;
  background: linear-gradient(100deg, #f5d76e 20%, #d4af37 50%, #8b6f1e 80%);
  background-size: 220% auto;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  animation: shineText 4s linear infinite;
  line-height: 1.2;
}
@keyframes shineText { to { background-position: 220% center; } }

.verify {
  font-size: 22px;
  -webkit-text-fill-color: var(--gold);
  color: var(--gold);
  filter: drop-shadow(0 0 8px var(--gold-glow));
}

.tagline {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 14px;
  color: var(--dim);
  letter-spacing: 2px;
  margin: 0;
  padding: 7px 18px;
  border-radius: 20px;
  background: rgba(212, 175, 55, 0.07);
  border: 1px solid var(--border);
  transition: all 0.3s ease;
}
.tagline:hover {
  background: rgba(212, 175, 55, 0.15);
  box-shadow: 0 0 20px var(--gold-glow);
  color: var(--gold-light);
}
.tagline i {
  color: var(--gold);
  filter: drop-shadow(0 0 6px var(--gold-glow));
}

.typed {
  font-size: 13.5px;
  color: var(--gold-light);
  min-height: 20px;
  letter-spacing: 0.5px;
  opacity: 1;
  margin: 0;
  display: block;
  visibility: visible;
  text-shadow: 0 0 8px rgba(212,175,55,0.4);
}
.typed::after {
  content: '|';
  color: var(--gold);
  animation: blink 1s steps(1) infinite;
  margin-right: 2px;
}
@keyframes blink { 50% { opacity: 0; } }

/* ================= Feature Boxes ================= */
.features {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  padding: 0 26px;
  margin-top: 26px;
}
.feature {
  background: linear-gradient(150deg, rgba(212,175,55,0.06), rgba(20,18,12,0.4));
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 18px 8px 16px;
  text-align: center;
  transition: all 0.35s ease;
  position: relative;
  overflow: hidden;
  cursor: default;
}
.feature::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  transition: left 0.6s;
}
.feature:hover::before { left: 100%; }
.feature:hover {
  transform: translateY(-6px);
  border-color: var(--gold);
  box-shadow: 0 12px 28px rgba(212,175,55,0.25);
  background: linear-gradient(150deg, rgba(212,175,55,0.12), rgba(20,18,12,0.5));
}

.feature .icon {
  font-size: 20px;
  color: var(--gold);
  filter: drop-shadow(0 0 8px var(--gold-glow));
}
.feature .value {
  display: block;
  margin-top: 8px;
  font-family: 'Reem Kufi', sans-serif;
  font-size: 17px;
  font-weight: 700;
  color: var(--gold-light);
  letter-spacing: 0.5px;
}
.feature .label {
  font-size: 11px;
  color: var(--dim);
  margin-top: 3px;
  letter-spacing: 1px;
}

/* ================= Divider ================= */
.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 30px 26px 18px;
  color: var(--dim);
  font-size: 12px;
  letter-spacing: 2px;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border), transparent);
}
.divider i { color: var(--gold); font-size: 11px; }

/* ================= Quotes ================= */
.quotes {
  margin: 0 26px;
  padding: 20px 22px;
  border-radius: 20px;
  background: linear-gradient(135deg, rgba(212,175,55,0.07), rgba(139,111,30,0.05));
  border: 1px solid var(--border);
  position: relative;
}
.quotes::before {
  content: '\f10d';
  font-family: 'Font Awesome 6 Free';
  font-weight: 900;
  position: absolute;
  top: -12px; right: 22px;
  color: var(--gold);
  background: #14120c;
  padding: 3px 10px;
  border-radius: 10px;
  font-size: 13px;
  box-shadow: 0 0 14px var(--gold-glow);
}
.quotes p {
  font-size: 15.5px;
  line-height: 2.05;
  color: var(--text);
  text-align: center;
}
.quotes p + p { margin-top: 10px; }
.quotes p i { color: var(--gold); margin-left: 4px; }

/* ================= Section Title ================= */
.sec-title {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 32px 26px 16px;
  font-family: 'Reem Kufi', sans-serif;
  font-size: 17px;
  font-weight: 600;
  color: var(--text);
}
.sec-title .ico {
  width: 34px; height: 34px;
  display: grid;
  place-items: center;
  border-radius: 11px;
  background: linear-gradient(135deg, rgba(212,175,55,0.2), rgba(139,111,30,0.15));
  border: 1px solid var(--border);
  color: var(--gold);
  font-size: 14px;
  box-shadow: 0 0 16px var(--gold-glow);
}
.sec-title .line {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--border), transparent);
}

/* ================= Videos ================= */
.videos-scroll {
  display: flex;
  gap: 14px;
  overflow-x: auto;
  padding: 4px 26px 16px;
  scroll-snap-type: x mandatory;
  scrollbar-width: thin;
  scrollbar-color: var(--gold) transparent;
}
.videos-scroll::-webkit-scrollbar { height: 6px; }
.videos-scroll::-webkit-scrollbar-track { background: transparent; }
.videos-scroll::-webkit-scrollbar-thumb {
  background: linear-gradient(90deg, var(--gold), var(--gold-soft));
  border-radius: 10px;
}
.video-box {
  position: relative;
  flex: 0 0 150px;
  height: 250px;
  border-radius: 18px;
  overflow: hidden;
  border: 1px solid var(--border);
  background: #000;
  scroll-snap-align: start;
  transition: transform 0.35s ease, box-shadow 0.35s ease;
}
.video-box::after {
  content: '\f144';
  font-family: 'Font Awesome 6 Free';
  font-weight: 900;
  position: absolute;
  bottom: 8px; right: 8px;
  color: #0a0a0a;
  background: var(--gold);
  width: 28px; height: 28px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 12px;
  pointer-events: none;
  box-shadow: 0 0 12px var(--gold-glow);
}
.video-box:hover {
  transform: translateY(-8px) scale(1.04);
  box-shadow: 0 16px 32px var(--gold-glow);
}
.video-box iframe {
  width: 100%; height: 100%;
  border: 0;
  display: block;
}

/* ================= Social ================= */
.social {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin: 6px 26px 0;
  flex-wrap: wrap;
}
.social a {
  position: relative;
  width: 48px; height: 48px;
  display: grid;
  place-items: center;
  border-radius: 15px;
  color: var(--text);
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  font-size: 18px;
  text-decoration: none;
  transition: all 0.35s cubic-bezier(.2,.9,.3,1.4);
  overflow: hidden;
}
.social a::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--gold), var(--gold-soft));
  opacity: 0;
  transition: opacity 0.35s;
}
.social a i { position: relative; z-index: 1; }
.social a:hover {
  transform: translateY(-6px) rotate(-6deg);
  color: #0a0a0a;
  border-color: transparent;
  box-shadow: 0 14px 28px var(--gold-glow);
}
.social a:hover::before { opacity: 1; }

/* ================= Footer ================= */
.footer {
  text-align: center;
  margin-top: 30px;
  font-size: 12px;
  color: var(--dim);
  letter-spacing: 1px;
}
.footer i { color: var(--gold); animation: beat 1.4s infinite; }
@keyframes beat {
  0%,100% { transform: scale(1); }
  25%     { transform: scale(1.25); }
  50%     { transform: scale(1); }
}

/* ================= Responsive ================= */
@media (max-width: 500px) {
  body { padding: 20px 10px; }
  .card { border-radius: 24px; }
  .cover { height: 140px; }
  .avatar-wrap { width: 120px; height: 120px; margin-top: -62px; }
  .name { font-size: 26px; }
  .features { gap: 8px; padding: 0 16px; }
  .feature .value { font-size: 14px; }
  .feature .icon { font-size: 17px; }
  .quotes { margin: 0 16px; padding: 16px; }
  .quotes p { font-size: 14px; }
  .sec-title, .social, .divider { margin-left: 16px; margin-right: 16px; }
  .videos-scroll { padding-left: 16px; padding-right: 16px; }
  .video-box { flex: 0 0 130px; height: 220px; }
}
</style>
</head>

<script>
/* ============ Custom Cursor ============ */
const cursor = document.querySelector('.cursor');
const dot = document.querySelector('.cursor-dot');
let mx = window.innerWidth / 2, my = window.innerHeight / 2;
let cx = mx, cy = my;

// نحدد موقع البداية عشان يبان من أول لحظة
cursor.style.left = cx + 'px';
cursor.style.top  = cy + 'px';
dot.style.left = mx + 'px';
dot.style.top  = my + 'px';

document.addEventListener('mousemove', e => {
  mx = e.clientX; my = e.clientY;
  dot.style.left = mx + 'px';
  dot.style.top  = my + 'px';
});
function animateCursor() {
  cx += (mx - cx) * 0.18;
  cy += (my - cy) * 0.18;
  cursor.style.left = cx + 'px';
  cursor.style.top  = cy + 'px';
  requestAnimationFrame(animateCursor);
}
animateCursor();

document.querySelectorAll('a, .video-box, .feature, .avatar').forEach(el => {
  el.addEventListener('mouseenter', () => cursor.classList.add('grow'));
  el.addEventListener('mouseleave', () => cursor.classList.remove('grow'));
});

/* ============ Mouse-Follow Highlight ============ */
const card = document.getElementById('card');
card.addEventListener('mousemove', e => {
  const r = card.getBoundingClientRect();
  card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
  card.style.setProperty('--my', (e.clientY - r.top)  + 'px');
});

/* ============ Typing Effect ============ */
const typedEl = document.getElementById('typed');
const lines = [
  'مرحبًا بيك في بروفايلي ✨',
  'ستايلش الشات 🐍',
  'صانع محتوى • مبدع • مميز',
];
let li = 0, ci = 0, deleting = false;

function typeLoop() {
  const current = lines[li];
  if (!deleting) {
    typedEl.textContent = current.slice(0, ++ci);
    if (ci === current.length) {
      deleting = true;
      return setTimeout(typeLoop, 1800);
    }
  } else {
    typedEl.textContent = current.slice(0, --ci);
    if (ci === 0) {
      deleting = false;
      li = (li + 1) % lines.length;
    }
  }
  setTimeout(typeLoop, deleting ? 45 : 85);
}
// نبدأ الكتابة فورًا بعد 300ms
setTimeout(typeLoop, 300);
