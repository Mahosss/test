<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SARA' ✦ Elegance</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

<style>
/* ================= Base ================= */
* {
  margin: 0; padding: 0; box-sizing: border-box;
}
:root {
  --bg: #050505;
  --card: #111111;
  --gold: #d4af37;
  --gold-light: #f3e5ab;
  --gold-dim: #8b7332;
  --text: #f5f5f5;
  --dim: #999999;
  --border: rgba(212, 175, 55, 0.2);
  --font-serif: 'Playfair Display', serif;
  --font-sans: 'Cairo', sans-serif;
}

body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 40px 15px;
  position: relative;
  overflow-x: hidden;
}

/* ================= Background Ambient ================= */
.ambient-light {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(212,175,55,0.08) 0%, transparent 60%);
  z-index: 0;
  pointer-events: none;
}

/* ================= Main Card ================= */
.profile-card {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 480px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 50px 30px 40px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 40px rgba(212,175,55,0.05);
  text-align: center;
  animation: fadeIn 1.2s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ================= Image (Centered) ================= */
.image-wrap {
  position: relative;
  width: 160px;
  height: 160px;
  margin: 0 auto 24px;
}
.image-ring {
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  background: conic-gradient(from 0deg, transparent, var(--gold), transparent, var(--gold), transparent);
  animation: spin 6s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
.profile-img {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: var(--bg);
  padding: 4px;
  z-index: 1;
}
.profile-img img {
  width: 100%; height: 100%;
  border-radius: 50%;
  object-fit: cover;
  display: block;
  user-select: none;
}

/* Status dot */
.status-dot {
  position: absolute;
  bottom: 8px; right: 8px;
  width: 20px; height: 20px;
  background: #22c55e;
  border: 3px solid var(--card);
  border-radius: 50%;
  z-index: 2;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.6); }
  50% { box-shadow: 0 0 0 10px rgba(34,197,94,0); }
}

/* ================= Name & Title ================= */
.name {
  font-family: var(--font-serif);
  font-size: 42px;
  font-weight: 700;
  color: var(--gold-light);
  letter-spacing: 2px;
  margin-bottom: 4px;
  line-height: 1.2;
}
.name i {
  font-size: 18px;
  color: var(--gold);
  vertical-align: middle;
  margin-right: 6px;
  filter: drop-shadow(0 0 8px rgba(212,175,55,0.5));
}

.title {
  font-size: 14px;
  color: var(--dim);
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 30px;
  position: relative;
  display: inline-block;
}
.title::after {
  content: '';
  display: block;
  width: 40px; height: 1px;
  background: var(--gold);
  margin: 12px auto 0;
}

/* ================= Info Grid (3 Boxes) ================= */
.info-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}
.info-box {
  background: rgba(255,255,255,0.02);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 8px;
  transition: all 0.3s ease;
}
.info-box:hover {
  background: rgba(212,175,55,0.06);
  border-color: var(--gold);
  transform: translateY(-3px);
}
.info-box i {
  font-size: 18px;
  color: var(--gold);
  margin-bottom: 8px;
  display: block;
}
.info-box .val {
  font-family: var(--font-serif);
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  display: block;
}
.info-box .lb {
  font-size: 10px;
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-top: 4px;
  display: block;
}

/* ================= Quote ================= */
.quote-box {
  background: linear-gradient(135deg, rgba(212,175,55,0.05), transparent);
  border-right: 2px solid var(--gold);
  padding: 16px 18px;
  margin-bottom: 30px;
  text-align: right;
  border-radius: 0 8px 8px 0;
  min-height: 80px;
  display: flex;
  align-items: center;
}
.quote-box p {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 16px;
  color: var(--text);
  line-height: 1.6;
  transition: opacity 0.4s ease;
}

/* ================= Social Links ================= */
.socials {
  display: flex;
  justify-content: center;
  gap: 16px;
}
.socials a {
  width: 44px; height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 16px;
  text-decoration: none;
  transition: all 0.3s ease;
}
.socials a:hover {
  background: var(--gold);
  border-color: var(--gold);
  color: #000;
  transform: translateY(-3px);
  box-shadow: 0 10px 20px rgba(212,175,55,0.2);
}

/* ================= Responsive ================= */
@media (max-width: 480px) {
  .profile-card { padding: 40px 20px 30px; }
  .name { font-size: 34px; }
  .image-wrap { width: 130px; height: 130px; }
  .info-grid { gap: 8px; }
  .info-box { padding: 12px 4px; }
  .info-box .val { font-size: 13px; }
  .quote-box p { font-size: 14px; }
}
</style>
</head>
<body>

<!-- Ambient Light -->
<div class="ambient-light"></div>

<!-- Profile Card -->
<main class="profile-card">

  <!-- Centered Image -->
  <div class="image-wrap">
    <div class="image-ring"></div>
    <div class="profile-img">
      <img src="https://img.alfrsantv.com/img/f176635888499821.png" alt="Sara">
    </div>
    <div class="status-dot"></div>
  </div>

  <!-- Name -->
  <h1 class="name">
    <i class="fas fa-crown"></i> sara'
  </h1>
  <div class="title">Digital Creator</div>

  <!-- Info Grid -->
  <div class="info-grid">
    <div class="info-box">
      <i class="fas fa-location-dot"></i>
      <span class="val">Cairo</span>
      <span class="lb">Location</span>
    </div>
    <div class="info-box">
      <i class="fas fa-face-smile"></i>
      <span class="val">Chill</span>
      <span class="lb">Mood</span>
    </div>
    <div class="info-box">
      <i class="fas fa-star"></i>
      <span class="val">Verified</span>
      <span class="lb">Status</span>
    </div>
  </div>

  <!-- Rotating Quote -->
  <div class="quote-box">
    <p id="quoteText">"الاحترافية مش بس في الشغل، الاحترافية في طريقة تعاملك مع نفسك الأول."</p>
  </div>

  <!-- Social Links -->
  <div class="socials">
    <a href="#" title="Instagram"><i class="fab fa-instagram"></i></a>
    <a href="#" title="TikTok"><i class="fab fa-tiktok"></i></a>
    <a href="#" title="YouTube"><i class="fab fa-youtube"></i></a>
    <a href="#" title="Telegram"><i class="fab fa-telegram"></i></a>
  </div>

</main>

<script>
/* ============ Rotating Quotes ============ */
const quotes = [
  '"الاحترافية مش بس في الشغل، الاحترافية في طريقة تعاملك مع نفسك الأول."',
  '"كوني نسخة أصلية، مش نسخة طبق الأصل من حد تاني."',
  '"النجاح بيبدأ لما تقرري إنك تستحقي الأفضل."',
  '"الأنوثة قوة، والذكاء سلاح، والاتنين مع بعض ملهمش حل."'
];

const quoteEl = document.getElementById('quoteText');
let idx = 0;

setInterval(() => {
  quoteEl.style.opacity = '0';
  setTimeout(() => {
    idx = (idx + 1) % quotes.length;
    quoteEl.textContent = quotes[idx];
    quoteEl.style.opacity = '1';
  }, 400);
}, 5000);
</script>

</body>
</html>
